# Blok HTTP untuk challenge + redirect
server {
    listen 80;
    server_name rdevelabs.biz.id;

    client_max_body_size 50M;

    # Folder challenge untuk Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Setelah SSL aktif, redirect semua HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name rdevelabs.biz.id;

    ssl_certificate /etc/letsencrypt/live/rdevelabs.biz.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rdevelabs.biz.id/privkey.pem;

    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Serve frontend (misalnya React/Vue hasil build)
    location / {
        proxy_pass http://frontend:80/;
    }

    # Proxy ke backend Express
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 300s; 
        proxy_send_timeout 300s; 
        proxy_read_timeout 300s; 
        send_timeout 300s;
    }
}
